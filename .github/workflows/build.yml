name: Build & Release JUCE Plugin

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "*"

jobs:
  build-macos:
    name: macOS (Universal arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Fetch all history and tags for git describe

      # Strategy 2: Dynamically extract version from git tag or git history
      - name: Extract Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            RAW_VER=$(git describe --tags --always | sed 's/^v//')
            VERSION=$(echo "$RAW_VER" | awk -F'-' '{print $1}')
          fi
          echo "PLUGIN_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"

      - name: Configure CMake (arm64)
        run: |
          cmake -B build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build Target (arm64)
        run: |
          cmake --build build-arm64 --config Release -j4

      - name: Configure CMake (x86_64)
        run: |
          cmake -B build-x86_64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DENABLE_AVX=ON

      - name: Build Target (x86_64)
        run: |
          cmake --build build-x86_64 --config Release -j4

      - name: Package & Create Universal Fat Binaries
        run: |
          mkdir -p staging
          
          cp -R build-arm64/NoiseRepellent_artefacts/Release/VST3/Noise\ Repellent.vst3 staging/
          cp -R build-arm64/NoiseRepellent_artefacts/Release/AU/Noise\ Repellent.component staging/
          cp -R build-arm64/NoiseRepellent_artefacts/Release/LV2/Noise\ Repellent.lv2 staging/ || true

          lipo -create \
            "build-arm64/NoiseRepellent_artefacts/Release/VST3/Noise Repellent.vst3/Contents/MacOS/Noise Repellent" \
            "build-x86_64/NoiseRepellent_artefacts/Release/VST3/Noise Repellent.vst3/Contents/MacOS/Noise Repellent" \
            -output "staging/Noise Repellent.vst3/Contents/MacOS/Noise Repellent"

          lipo -create \
            "build-arm64/NoiseRepellent_artefacts/Release/AU/Noise Repellent.component/Contents/MacOS/Noise Repellent" \
            "build-x86_64/NoiseRepellent_artefacts/Release/AU/Noise Repellent.component/Contents/MacOS/Noise Repellent" \
            -output "staging/Noise Repellent.component/Contents/MacOS/Noise Repellent"

          if [ -d "staging/Noise Repellent.lv2" ]; then
            ARM_DYLIB=$(find build-arm64/NoiseRepellent_artefacts/Release/LV2 -name "*.dylib" | head -n 1)
            X86_DYLIB=$(find build-x86_64/NoiseRepellent_artefacts/Release/LV2 -name "*.dylib" | head -n 1)
            TARGET_DYLIB=$(find "staging/Noise Repellent.lv2" -name "*.dylib" | head -n 1)

            if [ -n "$ARM_DYLIB" ] && [ -n "$X86_DYLIB" ]; then
              lipo -create "$ARM_DYLIB" "$X86_DYLIB" -output "$TARGET_DYLIB"
            fi
          fi

      - name: Ad-hoc Code Sign Plugins
        run: |
          codesign --force --deep --sign - staging/Noise\ Repellent.vst3
          codesign --force --deep --sign - staging/Noise\ Repellent.component
          codesign --force --deep --sign - staging/Noise\ Repellent.lv2 || true

      - name: Verify macOS Universal Architecture & Dependencies
        run: |
          echo "=== Locating built macOS plugin binaries ==="
          BINARIES=$(find staging -type f \( -name "Noise Repellent" -o -name "*.dylib" \))

          HAS_ERRORS=0

          for BINARY in $BINARIES; do
            echo "================================================="
            echo "Inspecting: $BINARY"
            echo "-------------------------------------------------"

            LIPO_INFO=$(lipo -info "$BINARY")
            echo "Architectures: $LIPO_INFO"
            
            if [[ "$LIPO_INFO" != *"x86_64"* ]] || [[ "$LIPO_INFO" != *"arm64"* ]]; then
              echo "❌ FAIL: Binary is missing required architectures (must be x86_64 + arm64)!"
              HAS_ERRORS=1
            else
              echo "✅ SUCCESS: Binary is Universal (x86_64 + arm64)."
            fi

            echo "-------------------------------------------------"
            otool -L "$BINARY"
            echo "-------------------------------------------------"

            BAD_DEPS=$(otool -L "$BINARY" | tail -n +2 | awk '{print $1}' | grep -vE "^/System/Library|^/usr/lib" || true)

            if [ -n "$BAD_DEPS" ]; then
              echo "❌ FAIL: Found non-system dynamic dependencies:"
              echo "$BAD_DEPS"
              HAS_ERRORS=1
            else
              echo "✅ SUCCESS: All dynamic dependencies are standard macOS system frameworks."
            fi
          done

          if [ $HAS_ERRORS -ne 0 ]; then
            exit 1
          fi

      - name: Build macOS PKG Installer
        run: |
          mkdir -p pkg_root/Library/Audio/Plug-Ins/Components
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3
          mkdir -p pkg_root/Library/Audio/Plug-Ins/LV2

          cp -R "staging/Noise Repellent.component" pkg_root/Library/Audio/Plug-Ins/Components/
          cp -R "staging/Noise Repellent.vst3" pkg_root/Library/Audio/Plug-Ins/VST3/
          if [ -d "staging/Noise Repellent.lv2" ]; then
            cp -R "staging/Noise Repellent.lv2" pkg_root/Library/Audio/Plug-Ins/LV2/
          fi

          PKGBUILD_CMD="pkgbuild --root pkg_root --identifier com.lucianodato.NoiseRepellent --version $PLUGIN_VERSION --install-location /"
          
          if [ -d "installer/macos/scripts" ]; then
            PKGBUILD_CMD="$PKGBUILD_CMD --scripts installer/macos/scripts"
          fi

          $PKGBUILD_CMD NoiseRepellent-macOS-Universal.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-macOS-installer
          path: NoiseRepellent-macOS-Universal.pkg

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: NoiseRepellent-macOS-Universal.pkg

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Fetch all history and tags for git describe

      # Strategy 2: Dynamically extract version from git tag or git history
      - name: Extract Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            RAW_VER=$(git describe --tags --always | sed 's/^v//')
            VERSION=$(echo "$RAW_VER" | awk -F'-' '{print $1}')
          fi
          echo "PLUGIN_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"

      - name: Install System UI Dependencies & Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y \
            build-essential cmake ninja-build \
            libasound2-dev libjack-jackd2-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libfontconfig1-dev

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Targets
        run: |
          cmake --build build --config Release -j4

      - name: Verify Plugin Dependencies & Static Linking (Linux)
        run: |
          echo "=== Locating built plugin binaries (.so) ==="
          PLUGINS=$(find build/NoiseRepellent_artefacts -name "*.so")

          if [ -z "$PLUGINS" ]; then
            echo "❌ ERROR: No .so plugin binaries found in build directory!"
            exit 1
          fi

          ALLOWED_LIBS="libc\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so|linux-vdso\.so|ld-linux"

          HAS_ERRORS=0

          for PLUGIN in $PLUGINS; do
            echo "================================================="
            echo "Inspecting: $PLUGIN"
            echo "-------------------------------------------------"
            
            ldd "$PLUGIN"
            echo "-------------------------------------------------"

            UNEXPECTED_LIBS=$(ldd "$PLUGIN" | grep "=>" | awk '{print $1}' | grep -vE "$ALLOWED_LIBS" || true)

            if [ -n "$UNEXPECTED_LIBS" ]; then
              echo "❌ FAIL: Found unexpected dynamic dependencies:"
              echo "$UNEXPECTED_LIBS"
              HAS_ERRORS=1
            else
              echo "✅ SUCCESS: All dynamic library dependencies are clean and whitelisted."
            fi

            UNDEF_SYMBOLS=$(objdump -T "$PLUGIN" | grep " UND " | grep -E "FT_|fftw_" || true)

            if [ -n "$UNDEF_SYMBOLS" ]; then
              echo "❌ FAIL: Found undefined third-party symbols:"
              echo "$UNDEF_SYMBOLS"
              HAS_ERRORS=1
            else
              echo "✅ SUCCESS: All FreeType and FFTW3 symbols are resolved internally."
            fi
          done

          if [ $HAS_ERRORS -ne 0 ]; then
            exit 1
          fi

      - name: Package Staging Artifacts
        run: |
          mkdir -p staging
          cp -R build/NoiseRepellent_artefacts/Release/VST3/Noise\ Repellent.vst3 staging/ || true
          cp -R build/NoiseRepellent_artefacts/Release/LV2/Noise\ Repellent.lv2 staging/ || true

      - name: Build Debian Package
        run: |
          mkdir -p deb_root/DEBIAN
          mkdir -p deb_root/usr/lib/vst3
          mkdir -p deb_root/usr/lib/lv2

          cat << EOF > deb_root/DEBIAN/control
          Package: noise-repellent
          Version: $PLUGIN_VERSION
          Architecture: amd64
          Maintainer: Luciano Dato <lucianodato@net>
          Description: Noise Repellent Audio Processing Plugin
          EOF

          cp -R "staging/Noise Repellent.vst3" deb_root/usr/lib/vst3/
          cp -R "staging/Noise Repellent.lv2" deb_root/usr/lib/lv2/

          dpkg-deb --build deb_root noise-repellent_${PLUGIN_VERSION}_amd64.deb

      - name: Create Universal Tarball with Installer Script
        run: |
          cat << 'EOF' > staging/install.sh
          #!/bin/bash
          set -e

          VST3_DIR="$HOME/.vst3"
          LV2_DIR="$HOME/.lv2"

          echo "Installing Noise Repellent..."
          mkdir -p "$VST3_DIR" "$LV2_DIR"

          if [ -d "Noise Repellent.vst3" ]; then
            cp -r "Noise Repellent.vst3" "$VST3_DIR/"
            echo " -> Installed VST3 to $VST3_DIR/Noise Repellent.vst3"
          fi

          if [ -d "Noise Repellent.lv2" ]; then
            cp -r "Noise Repellent.lv2" "$LV2_DIR/"
            echo " -> Installed LV2 to $LV2_DIR/Noise Repellent.lv2"
          fi

          echo "Installation complete!"
          EOF

          chmod +x staging/install.sh

          cd staging && tar -czvf ../noise-repellent-linux-x86_64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-linux-deb
          path: noise-repellent_${{ env.PLUGIN_VERSION }}_amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-linux-tarball
          path: noise-repellent-linux-x86_64.tar.gz

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            noise-repellent_${{ env.PLUGIN_VERSION }}_amd64.deb
            noise-repellent-linux-x86_64.tar.gz

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Fetch all history and tags for git describe

      # Strategy 2: Dynamically extract version from git tag or git history
      - name: Extract Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            RAW_VER=$(git describe --tags --always | sed 's/^v//')
            VERSION=$(echo "$RAW_VER" | awk -F'-' '{print $1}')
          fi
          echo "PLUGIN_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"

      - name: Configure CMake
        run: |
          cmake -B build

      - name: Build Targets
        run: |
          cmake --build build --config Release -j4

      - name: Package Staging Artifacts
        shell: bash
        run: |
          mkdir -p staging
          cp -R build/NoiseRepellent_artefacts/Release/VST3/Noise\ Repellent.vst3 staging/ || true
          cp -R build/NoiseRepellent_artefacts/Release/LV2/Noise\ Repellent.lv2 staging/ || true

      - name: Verify Windows DLL Dependencies
        shell: bash
        run: |
          echo "=== Locating built Windows plugin binaries ==="
          BINARIES=$(find staging -type f \( -name "*.vst3" -o -name "*.dll" \))

          if [ -z "$BINARIES" ]; then
            echo "❌ ERROR: No .vst3 or .dll plugin binaries found in staging!"
            exit 1
          fi

          HAS_ERRORS=0
          ALLOWED_DLLS="KERNEL32\.dll|USER32\.dll|GDI32\.dll|SHELL32\.dll|ADVAPI32\.dll|OLE32\.dll|SETUPAPI\.dll|COMDLG32\.dll|WS2_32\.dll|IMM32\.dll|VERSION\.dll|VCRUNTIME140.*\.dll|MSVCP140.*\.dll|ucrtbase\.dll|api-ms-win-.*\.dll|MFPlat\.dll"

          for BINARY in $BINARIES; do
            echo "================================================="
            echo "Inspecting: $BINARY"
            echo "-------------------------------------------------"

            DEPENDENTS=$(objdump -p "$BINARY" 2>/dev/null | grep -i "DLL Name:" | awk '{print $3}' || true)

            echo "Imported DLLs:"
            echo "$DEPENDENTS"
            echo "-------------------------------------------------"

            UNEXPECTED_DLLS=$(echo "$DEPENDENTS" | grep -ivE "$ALLOWED_DLLS" || true)

            if [ -n "$UNEXPECTED_DLLS" ]; then
              echo "❌ FAIL: Found non-standard dynamic DLL dependencies:"
              echo "$UNEXPECTED_DLLS"
              HAS_ERRORS=1
            else
              echo "✅ SUCCESS: All imported DLLs are standard Windows system runtimes."
            fi
          done

          if [ $HAS_ERRORS -ne 0 ]; then
            exit 1
          fi

      - name: Build Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Installers/windows/installer.iss
          options: /O"Output" /DMyAppVersion=${{ env.PLUGIN_VERSION }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-win64-installer
          path: Output/NoiseRepellent-Win64-Installer.exe

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Output/NoiseRepellent-Win64-Installer.exe
