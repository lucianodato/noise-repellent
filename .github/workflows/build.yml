name: Build & Release JUCE Plugin

on:
  push:
    tags:
    - "v*.*.*"
  pull_request:
    branches:
      - "*"

jobs:
  build-macos:
    name: macOS (Universal arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake fftw libomp

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build Targets
        run: |
          cmake --build build --config Release -j4

      - name: Package Artifacts
        run: |
          mkdir -p staging
          cp -R build/NoiseRepellent_artefacts/Release/VST3/Noise\ Repellent.vst3 staging/
          cp -R build/NoiseRepellent_artefacts/Release/AU/Noise\ Repellent.component staging/
          cp -R build/NoiseRepellent_artefacts/Release/LV2/Noise\ Repellent.lv2 staging/ || true
          cd staging && zip -r ../noise-repellent-macOS-universal.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-macOS-universal
          path: staging/

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: noise-repellent-macOS-universal.zip

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y \
            cmake libfftw3-dev libomp-dev \
            libasound2-dev libjack-jackd2-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libfreetype6-dev libfontconfig1-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Targets
        run: |
          cmake --build build --config Release -j4

      - name: Package Artifacts
        run: |
          mkdir -p staging
          cp -R build/NoiseRepellent_artefacts/Release/VST3/Noise\ Repellent.vst3 staging/ || true
          cp -R build/NoiseRepellent_artefacts/Release/LV2/Noise\ Repellent.lv2 staging/ || true
          cd staging && zip -r ../noise-repellent-linux64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-linux64
          path: staging/

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: noise-repellent-linux64.zip

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Targets
        run: |
          cmake --build build --config Release -j4

      - name: Package Artifacts
        shell: bash
        run: |
          mkdir -p staging
          cp -R build/NoiseRepellent_artefacts/Release/VST3/Noise\ Repellent.vst3 staging/ || true
          cp -R build/NoiseRepellent_artefacts/Release/LV2/Noise\ Repellent.lv2 staging/ || true
          cd staging && 7z a ../noise-repellent-win64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-win64
          path: staging/

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: noise-repellent-win64.zip
