name: Build & Release JUCE Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "*"

env:
  CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros

jobs:
  build-macos:
    name: macOS (Universal arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract Version
        id: extract_version
        run: |
          BASE_VER=$(sed -n -E 's/.*project\(NoiseRepellent VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
            if [ -z "$BASE_VER" ]; then echo "ERROR: failed to parse version from CMakeLists.txt" >&2; exit 1; fi
            VERSION="${BASE_VER}-${SHORT_SHA}"
          fi
          echo "PLUGIN_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION} (CMake base ${BASE_VER})"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache
          max-size: 2000M
          verbose: 2

      - name: Configure CMake (arm64)
        run: |
          cmake -B build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Target (arm64)
        run: |
          cmake --build build-arm64 --config Release -j4

      - name: Configure CMake (x86_64)
        run: |
          cmake -B build-x86_64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DENABLE_AVX=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Target (x86_64)
        run: |
          cmake --build build-x86_64 --config Release -j4

      - name: CCache Statistics
        run: |
          echo "### CCache Statistics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ccache -s >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package & Create Universal Fat Binaries
        run: |
          mkdir -p staging
          
          ARM_VST3_DIR=$(find build-arm64/NoiseRepellent_artefacts -name "Noise Repellent.vst3" -type d | head -n 1)
          ARM_AU_DIR=$(find build-arm64/NoiseRepellent_artefacts -name "Noise Repellent.component" -type d | head -n 1)
          ARM_LV2_DIR=$(find build-arm64/NoiseRepellent_artefacts -name "Noise Repellent.lv2" -type d | head -n 1)

          cp -R "$ARM_VST3_DIR" staging/
          cp -R "$ARM_AU_DIR" staging/
          if [ -n "$ARM_LV2_DIR" ]; then
            cp -R "$ARM_LV2_DIR" staging/ || true
          fi

          X86_VST3_BIN=$(find build-x86_64/NoiseRepellent_artefacts -path "*/VST3/*.vst3/Contents/MacOS/Noise Repellent" | head -n 1)
          X86_AU_BIN=$(find build-x86_64/NoiseRepellent_artefacts -path "*/AU/*.component/Contents/MacOS/Noise Repellent" | head -n 1)

          lipo -create \
            "$ARM_VST3_DIR/Contents/MacOS/Noise Repellent" \
            "$X86_VST3_BIN" \
            -output "staging/Noise Repellent.vst3/Contents/MacOS/Noise Repellent"

          lipo -create \
            "$ARM_AU_DIR/Contents/MacOS/Noise Repellent" \
            "$X86_AU_BIN" \
            -output "staging/Noise Repellent.component/Contents/MacOS/Noise Repellent"

          if [ -d "staging/Noise Repellent.lv2" ]; then
            ARM_DYLIB=$(find build-arm64/NoiseRepellent_artefacts -path "*/LV2/*.lv2/*" -name "*.dylib" | head -n 1)
            X86_DYLIB=$(find build-x86_64/NoiseRepellent_artefacts -path "*/LV2/*.lv2/*" -name "*.dylib" | head -n 1)
            TARGET_DYLIB=$(find "staging/Noise Repellent.lv2" -name "*.dylib" | head -n 1)

            if [ -n "$ARM_DYLIB" ] && [ -n "$X86_DYLIB" ]; then
              lipo -create "$ARM_DYLIB" "$X86_DYLIB" -output "$TARGET_DYLIB"
            fi
          fi

      - name: Strip Binaries (Release)
        run: |
          echo "Stripping macOS universal binaries..."
          find staging -type f \( -name "Noise Repellent" -o -name "*.dylib" \) -exec strip -x {} \; 2>&1 | head -n 20 || true
          find staging -type f \( -name "Noise Repellent" -o -name "*.dylib" \) -exec ls -lh {} \; 2>&1 | head -n 20 || true

      - name: Ad-hoc Code Sign Plugins
        run: |
          codesign --force --deep --sign - staging/Noise\ Repellent.vst3
          codesign --force --deep --sign - staging/Noise\ Repellent.component
          codesign --force --deep --sign - staging/Noise\ Repellent.lv2 || true

      - name: Verify macOS Universal Architecture & Dependencies
        run: |
          echo "🔍 Verifying macOS plugin binaries..."
          IFS=$'\n'
          BINARIES=$(find staging -type f \( -name "Noise Repellent" -o -name "*.dylib" \))

          if [ -z "$BINARIES" ]; then
            echo "❌ ERROR: No plugin binaries found in staging directory!"
            exit 1
          fi

          HAS_ERRORS=0

          for BINARY in $BINARIES; do
            if [[ "$BINARY" == *".vst3"* ]]; then
              NAME="Noise Repellent.vst3"
            elif [[ "$BINARY" == *".component"* ]]; then
              NAME="Noise Repellent.component"
            elif [[ "$BINARY" == *".lv2"* ]]; then
              NAME="Noise Repellent.lv2"
            else
              NAME=$(basename "$BINARY")
            fi
            
            set +e
            set +o pipefail
            LIPO_INFO=$(lipo -info "$BINARY" 2>&1)
            LIPO_STATUS=$?
            set -e
            set -o pipefail

            ARCH_FAILED=0
            if [ $LIPO_STATUS -ne 0 ] || [[ "$LIPO_INFO" != *"x86_64"* ]] || [[ "$LIPO_INFO" != *"arm64"* ]]; then
              ARCH_FAILED=1
            fi

            BAD_DEPS=$(otool -L "$BINARY" 2>/dev/null | tail -n +2 | sed -E 's/^[[:space:]]+//; s/[[:space:]]+\(compatibility.*//' | grep -vE "^/System/Library|^/usr/lib|^@loader_path|^@executable_path|^@rpath|Noise Repellent|staging/" || true)
            BINARY_SIZE=$(stat -f%z "$BINARY" 2>/dev/null || stat -c%s "$BINARY" 2>/dev/null || wc -c < "$BINARY" 2>/dev/null | tr -d ' ')
            HAS_SPECBLEACH=$(nm -a "$BINARY" 2>/dev/null | grep -i "specbleach" | head -n 1 || true)
            if [ -z "$HAS_SPECBLEACH" ] && [ "$BINARY_SIZE" -lt 8000000 ]; then
              MISSING_SPECBLEACH=1
            else
              MISSING_SPECBLEACH=0
            fi

            if [ -n "$BAD_DEPS" ] || [ $ARCH_FAILED -ne 0 ] || [ "$MISSING_SPECBLEACH" -eq 1 ]; then
              echo "❌ [FAIL] $NAME"
              [ $ARCH_FAILED -ne 0 ] && echo "   └─ Architecture error: $LIPO_INFO"
              [ -n "$BAD_DEPS" ] && echo "   └─ Dynamic leaks: $(echo "$BAD_DEPS" | tr '\n' ' ')"
              [ "$MISSING_SPECBLEACH" -eq 1 ] && echo "   └─ Missing libspecbleach embedding (size ${BINARY_SIZE} < 8M and no specbleach symbols)"
              HAS_ERRORS=1
            else
              echo "✔ [PASS] $NAME (Universal x86_64+arm64)"
            fi
          done

          if [ $HAS_ERRORS -ne 0 ]; then
            exit 1
          fi
          echo "✨ All macOS binaries verified clean!"

      - name: Create Zip Archive
        run: |
          cd staging && zip -r "../noise-repellent-macOS-Universal-${PLUGIN_VERSION}.zip" *

      - name: Build macOS PKG Installer
        run: |
          mkdir -p pkg_root/Library/Audio/Plug-Ins/Components
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3
          mkdir -p pkg_root/Library/Audio/Plug-Ins/LV2
          mkdir -p pkg_scripts

          cp -R "staging/Noise Repellent.component" pkg_root/Library/Audio/Plug-Ins/Components/
          cp -R "staging/Noise Repellent.vst3" pkg_root/Library/Audio/Plug-Ins/VST3/
          if [ -d "staging/Noise Repellent.lv2" ]; then
            cp -R "staging/Noise Repellent.lv2" pkg_root/Library/Audio/Plug-Ins/LV2/
          fi

          cat << 'EOF' > pkg_scripts/postinstall
          #!/bin/sh
          # Remove quarantine attributes from installed plugins
          xattr -cr "/Library/Audio/Plug-Ins/Components/Noise Repellent.component" 2>/dev/null || true
          xattr -cr "/Library/Audio/Plug-Ins/VST3/Noise Repellent.vst3" 2>/dev/null || true
          xattr -cr "/Library/Audio/Plug-Ins/LV2/Noise Repellent.lv2" 2>/dev/null || true
          exit 0
          EOF
          chmod +x pkg_scripts/postinstall

          pkgbuild --root pkg_root \
            --identifier com.lucianodato.NoiseRepellent \
            --version "$PLUGIN_VERSION" \
            --install-location / \
            --scripts pkg_scripts \
            "NoiseRepellent-macOS-Universal-${PLUGIN_VERSION}.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-macOS-installer-${{ steps.extract_version.outputs.version }}
          path: NoiseRepellent-macOS-Universal-${{ steps.extract_version.outputs.version }}.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-macOS-zip-${{ steps.extract_version.outputs.version }}
          path: noise-repellent-macOS-Universal-${{ steps.extract_version.outputs.version }}.zip

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            NoiseRepellent-macOS-Universal-${{ steps.extract_version.outputs.version }}.pkg
            noise-repellent-macOS-Universal-${{ steps.extract_version.outputs.version }}.zip

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract Version
        id: extract_version
        run: |
          BASE_VER=$(sed -n -E 's/.*project\(NoiseRepellent VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
            if [ -z "$BASE_VER" ]; then echo "ERROR: failed to parse version from CMakeLists.txt" >&2; exit 1; fi
            VERSION="${BASE_VER}-${SHORT_SHA}"
          fi
          echo "PLUGIN_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION} (CMake base ${BASE_VER})"

      - name: Install System UI Dependencies & Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y \
            build-essential cmake ninja-build \
            libasound2-dev libjack-jackd2-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libfontconfig1-dev libfreetype6-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache
          max-size: 2000M
          verbose: 2

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Plugins
        run: |
          cmake --build build --config Release

      - name: Strip Binaries (Release)
        run: |
          echo "Stripping Linux binaries..."
          find build/NoiseRepellent_artefacts -name "*.so" -exec strip --strip-unneeded {} \; 2>&1 | head -n 20 || true
          find build/NoiseRepellent_artefacts -name "*.so" -exec ls -lh {} \; 2>&1 | head -n 20 || true

      - name: CCache Statistics
        run: |
          echo "### CCache Statistics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ccache -s >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify Plugin Dependencies & Symbol Isolation (Linux)
        run: |
          set +e
          set +o pipefail

          echo "🔍 Verifying Linux plugin binaries (.so)..."
          IFS=$'\n'
          PLUGINS=$(find build/NoiseRepellent_artefacts -name "*.so")

          if [ -z "$PLUGINS" ]; then
            echo "❌ ERROR: No .so plugin binaries found!"
            exit 1
          fi

          ALLOWED_LIBS="libc\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so|ld-linux|libasound\.so|libGL\.so|libX11\.so|libXext\.so|libXcursor\.so|libXinerama\.so|libXrandr\.so|libXrender\.so|libXi\.so|libgomp\.so"
          HAS_ERRORS=0

          for PLUGIN in $PLUGINS; do
            NAME=$(basename "$PLUGIN")
            echo "Checking $NAME..."

            UNEXPECTED_LIBS=$(ldd "$PLUGIN" 2>/dev/null | awk '/=>/ {print $1}' | grep -vE "$ALLOWED_LIBS" || true)
            DEFINED_LEAKS=$(nm -D --defined-only "$PLUGIN" 2>/dev/null | grep -iE '[[:space:]](FT_|fftwf?_)' || true)
            UNDEFINED_LEAKS=$(nm -D --undefined-only "$PLUGIN" 2>/dev/null | grep -iE '[[:space:]](FT_|fftwf?_)' || true)
            PLUGIN_SIZE=$(stat -c%s "$PLUGIN" 2>/dev/null || stat -f%z "$PLUGIN" 2>/dev/null || echo 0)
            HAS_SPECBLEACH=$(strings "$PLUGIN" 2>/dev/null | grep -i "specbleach" | head -n 1 || true)
            if [ -z "$HAS_SPECBLEACH" ] && [ "$PLUGIN_SIZE" -lt 8000000 ]; then
              MISSING_SPECBLEACH=1
            else
              MISSING_SPECBLEACH=0
            fi

            if [ -n "$UNEXPECTED_LIBS" ] || [ -n "$DEFINED_LEAKS" ] || [ -n "$UNDEFINED_LEAKS" ] || [ "$MISSING_SPECBLEACH" -eq 1 ]; then
              echo "❌ [FAIL] Verification failed for $NAME"
              [ -n "$UNEXPECTED_LIBS" ] && echo "   └─ Dynamic library leaks: $(echo "$UNEXPECTED_LIBS" | tr '\n' ' ')"
              [ -n "$DEFINED_LEAKS" ] && echo "   └─ Exported static symbols: $(echo "$DEFINED_LEAKS" | tr '\n' ' ')"
              [ -n "$UNDEFINED_LEAKS" ] && echo "   └─ Undefined system symbols: $(echo "$UNDEFINED_LEAKS" | tr '\n' ' ')"
              [ "$MISSING_SPECBLEACH" -eq 1 ] && echo "   └─ Missing libspecbleach embedding (size ${PLUGIN_SIZE} < 8M and no specbleach strings)"
              HAS_ERRORS=1
            else
              echo "✔ [PASS] $NAME (Dependencies clean & symbols fully isolated)"
            fi
          done

          if [ $HAS_ERRORS -ne 0 ]; then
            exit 1
          fi
          echo "✨ All Linux binaries verified clean and properly encapsulated!"

      - name: Package Staging Artifacts
        run: |
          mkdir -p staging
          VST3_DIR=$(find build/NoiseRepellent_artefacts -name "Noise Repellent.vst3" -type d | head -n 1)
          LV2_DIR=$(find build/NoiseRepellent_artefacts -name "Noise Repellent.lv2" -type d | head -n 1)
          if [ -n "$VST3_DIR" ]; then
            cp -R "$VST3_DIR" staging/ || true
          fi
          if [ -n "$LV2_DIR" ]; then
            cp -R "$LV2_DIR" staging/ || true
          fi

      - name: Build Debian Package
        run: |
          mkdir -p deb_root/DEBIAN
          mkdir -p deb_root/usr/lib/vst3
          mkdir -p deb_root/usr/lib/lv2

          cat << EOF > deb_root/DEBIAN/control
          Package: noise-repellent
          Version: $PLUGIN_VERSION
          Architecture: amd64
          Maintainer: Luciano Dato <lucianodato@net>
          Depends: libasound2 (>= 1.0.16), libgl1, libx11-6, libxext6, libxcursor1, libxinerama1, libxrandr2
          Description: Noise Repellent Audio Processing Plugin
          EOF

          cp -R "staging/Noise Repellent.vst3" deb_root/usr/lib/vst3/
          cp -R "staging/Noise Repellent.lv2" deb_root/usr/lib/lv2/

          dpkg-deb --build deb_root "noise-repellent_${PLUGIN_VERSION}_amd64.deb"

      - name: Create Universal Tarball with Installer Script
        run: |
          cat << 'EOF' > staging/install.sh
          #!/bin/bash
          set -e

          VST3_DIR="$HOME/.vst3"
          LV2_DIR="$HOME/.lv2"

          echo "Installing Noise Repellent..."
          mkdir -p "$VST3_DIR" "$LV2_DIR"

          if [ -d "Noise Repellent.vst3" ]; then
            cp -r "Noise Repellent.vst3" "$VST3_DIR/"
            echo " -> Installed VST3 to $VST3_DIR/Noise Repellent.vst3"
          fi

          if [ -d "Noise Repellent.lv2" ]; then
            cp -r "Noise Repellent.lv2" "$LV2_DIR/"
            echo " -> Installed LV2 to $LV2_DIR/Noise Repellent.lv2"
          fi

          echo "Installation complete!"
          EOF

          chmod +x staging/install.sh

          cd staging && tar -czvf "../noise-repellent-linux-x86_64-${PLUGIN_VERSION}.tar.gz" *

      - uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-linux-deb-${{ steps.extract_version.outputs.version }}
          path: noise-repellent_${{ steps.extract_version.outputs.version }}_amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-linux-tarball-${{ steps.extract_version.outputs.version }}
          path: noise-repellent-linux-x86_64-${{ steps.extract_version.outputs.version }}.tar.gz

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            noise-repellent_${{ steps.extract_version.outputs.version }}_amd64.deb
            noise-repellent-linux-x86_64-${{ steps.extract_version.outputs.version }}.tar.gz

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Remove Strawberry Perl from PATH
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Strawberry*' }) -join ';'
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV

      - name: Extract Version
        id: extract_version
        shell: bash
        run: |
          BASE_VER=$(sed -n -E 's/.*project\(NoiseRepellent VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
            if [ -z "$BASE_VER" ]; then echo "ERROR: failed to parse version from CMakeLists.txt" >&2; exit 1; fi
            VERSION="${BASE_VER}-${SHORT_SHA}"
          fi
          echo "PLUGIN_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION} (CMake base ${BASE_VER})"

      - name: Set up Ninja & MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache
          max-size: 2000M
          verbose: 2

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Targets
        run: |
          cmake --build build --config Release -j4

      - name: Strip Binaries (Release)
        shell: bash
        run: |
          echo "Stripping Windows binaries (if symbols present)..."
          # MSVC Release with /DEBUG embeds PDB; stripping with strip --strip-unneeded if available
          find build/NoiseRepellent_artefacts -type f \( -name "*.vst3" -o -name "*.dll" \) -exec ls -lh {} \; 2>&1 | head -n 20 || true

      - name: CCache Statistics
        shell: bash
        run: |
          echo "### CCache Statistics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ccache -s >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package Staging Artifacts
        shell: bash
        run: |
          mkdir -p staging
          echo "Listing JUCE artifacts directory:"
          find build -type f \( -name "*.vst3" -o -name "*.dll" \) || true
          
          VST3_FILE=$(find build/NoiseRepellent_artefacts -type f -name "*.vst3" 2>/dev/null | head -n 1)
          if [ -n "$VST3_FILE" ]; then
            cp "$VST3_FILE" staging/Noise\ Repellent.vst3
          else
            VST3_DIR=$(find build/NoiseRepellent_artefacts -name "Noise Repellent.vst3" -type d | head -n 1)
            if [ -n "$VST3_DIR" ]; then
              cp -R "$VST3_DIR" staging/ || true
            fi
          fi

          LV2_DIR=$(find build/NoiseRepellent_artefacts -name "Noise Repellent.lv2" -type d | head -n 1)
          if [ -n "$LV2_DIR" ]; then
            cp -R "$LV2_DIR" staging/ || true
          fi

      - name: Verify Windows DLL Dependencies
        shell: bash
        run: |
          set +e
          set +o pipefail
          echo "🔍 Verifying Windows plugin binaries (.vst3 / .dll)..."
          IFS=$'\n'
          BINARIES=$(find staging -type f \( -name "*.vst3" -o -name "*.dll" \))

          if [ -z "$BINARIES" ]; then
            echo "❌ ERROR: No .vst3 or .dll plugin binaries found!"
            exit 1
          fi

          HAS_ERRORS=0
          ALLOWED_DLLS="KERNEL32\.dll|USER32\.dll|GDI32\.dll|SHELL32\.dll|ADVAPI32\.dll|OLE32\.dll|OLEAUT32\.dll|SETUPAPI\.dll|COMDLG32\.dll|WS2_32\.dll|IMM32\.dll|VERSION\.dll|WINMM\.dll|UXTHEME\.dll|SHLWAPI\.dll|WININET\.dll|dbghelp\.dll|COMCTL32\.dll|d2d1\.dll|dxgi\.dll|d3d11\.dll|dcomp\.dll|dwmapi\.dll|VCRUNTIME140.*\.dll|MSVCP140.*\.dll|ucrtbase\.dll|api-ms-win-.*\.dll|MFPlat\.dll|bcrypt\.dll|RPCRT4\.dll|PROPSYS\.dll"
          
          for BINARY in $BINARIES; do
            NAME=$(basename "$BINARY")
            DEPENDENTS=$(objdump -p "$BINARY" 2>/dev/null | grep -i "DLL Name:" | awk '{print $3}')

            if [ -z "$DEPENDENTS" ]; then
              echo "❌ ERROR: Failed to extract DLL dependencies from $NAME (objdump failed or no imports found)"
              exit 1
            fi

            UNEXPECTED_DLLS=$(echo "$DEPENDENTS" | grep -ivE "$ALLOWED_DLLS" || true)
            BINARY_SIZE=$(stat -c%s "$BINARY" 2>/dev/null || stat -f%z "$BINARY" 2>/dev/null || wc -c < "$BINARY" 2>/dev/null | tr -d ' ')
            HAS_SPECBLEACH=$(nm -a "$BINARY" 2>/dev/null | grep -i "specbleach" | head -n 1 || true)
            if [ -z "$HAS_SPECBLEACH" ]; then HAS_SPECBLEACH=$(llvm-nm "$BINARY" 2>/dev/null | grep -i "specbleach" | head -n 1 || true); fi
            if [ -z "$HAS_SPECBLEACH" ]; then HAS_SPECBLEACH=$(strings "$BINARY" 2>/dev/null | grep -i "specbleach" | head -n 1 || true); fi
            if [ -z "$HAS_SPECBLEACH" ]; then HAS_SPECBLEACH=$(dumpbin /SYMBOLS "$BINARY" 2>/dev/null | grep -i "specbleach" | head -n 1 || true); fi
            if [ -z "$HAS_SPECBLEACH" ] && [ "$BINARY_SIZE" -lt 5000000 ]; then
              echo "❌ $NAME missing libspecbleach embedding (size ${BINARY_SIZE} <5M and no specbleach symbols)"
              MISSING_SPECBLEACH=1
            else
              MISSING_SPECBLEACH=0
            fi
            echo "   Size: ${BINARY_SIZE} bytes, specbleach found: $([ -n "$HAS_SPECBLEACH" ] && echo yes || echo no)"

            if [ -n "$UNEXPECTED_DLLS" ] || [ "$MISSING_SPECBLEACH" -eq 1 ]; then
              echo "❌ [FAIL] $NAME"
              [ -n "$UNEXPECTED_DLLS" ] && echo "   └─ Dynamic leaks: $(echo "$UNEXPECTED_DLLS" | tr '\n' ' ')"
              [ "$MISSING_SPECBLEACH" -eq 1 ] && echo "   └─ Missing libspecbleach embedding (size ${BINARY_SIZE} < 5M and no specbleach symbols)"
              HAS_ERRORS=1
            else
              echo "✔ [PASS] $NAME"
            fi
          done

          if [ $HAS_ERRORS -ne 0 ]; then
            exit 1
          fi
          echo "✨ All Windows binaries verified clean!"

      - name: Create Zip Archive
        shell: bash
        run: |
          cd staging && 7z a "../noise-repellent-windows-x64-${PLUGIN_VERSION}.zip" *

      - name: Generate Inno Setup Script
        shell: bash
        run: |
          mkdir -p installer_build
          cat << EOF > installer_build/installer.iss
          [Setup]
          AppName=Noise Repellent
          AppVersion=${PLUGIN_VERSION}
          AppPublisher=Luciano Dato
          DefaultDirName={commoncf}\VST3
          DisableDirPage=yes
          OutputBaseFilename=NoiseRepellent-Win64-Installer
          Compression=lzma2/ultra64
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "..\staging\Noise Repellent.vst3"; DestDir: "{commoncf}\VST3"; Flags: ignoreversion
          Source: "..\staging\Noise Repellent.lv2\*"; DestDir: "{commoncf}\LV2\Noise Repellent.lv2"; Flags: ignoreversion recursesubdirs createallsubdirs
          EOF

      - name: Build Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer_build/installer.iss
          options: /O"Output" /DMyAppVersion=${{ steps.extract_version.outputs.version }}

      - name: Rename Installer Artifact
        shell: bash
        run: |
          mv Output/NoiseRepellent-Win64-Installer.exe "Output/NoiseRepellent-Win64-Installer-${PLUGIN_VERSION}.exe"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-win64-installer-${{ steps.extract_version.outputs.version }}
          path: Output/NoiseRepellent-Win64-Installer-${{ steps.extract_version.outputs.version }}.exe

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noise-repellent-win64-zip-${{ steps.extract_version.outputs.version }}
          path: noise-repellent-windows-x64-${{ steps.extract_version.outputs.version }}.zip

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Output/NoiseRepellent-Win64-Installer-${{ steps.extract_version.outputs.version }}.exe
            noise-repellent-windows-x64-${{ steps.extract_version.outputs.version }}.zip
