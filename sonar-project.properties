sonar.organization=lucianodato
sonar.projectKey=lucianodato_noise-repellent
sonar.sources=Source
sonar.tests=Source/Tests
sonar.exclusions=Source/Tests/**
# Coverage only: gcc attributes the internal branches of inlined JUCE template
# ctors (AudioParameterBool, FontOptions, String, make_unique) to the plain
# statement lines of the plugin plumbing files; those jumps are not coverable
# logic. Engine logic (ProcessorSubsystems et al.) stays fully measured.
sonar.coverage.exclusions=Source/Denoiser/PluginEditor.cpp,Source/Denoiser/PluginEditor.h,Source/Denoiser/PluginProcessor.cpp
sonar.cfamily.compile-commands=build-test/compile_commands.json
sonar.cfamily.cobertura.reportPaths=build-test/coverage.xml
